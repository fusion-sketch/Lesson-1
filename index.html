*{box-sizing:border-box}body{margin:0;background:#faf2e8;color:#151515;font-family:Arial,sans-serif}.top{height:64px;background:white;border-bottom:4px solid #f5650a;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-weight:800}.top span{color:#f5650a}.tagtop{font-weight:400;font-style:italic;color:#555}.slide{display:none;min-height:calc(100vh - 64px);padding:38px 6% 105px}.slide.active{display:block}.slide h1{font-size:clamp(30px,5vw,54px);margin:0 0 8px}.sub{font-size:clamp(16px,2vw,22px);color:#666;margin-bottom:28px}.hero{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.brandbig{font-size:clamp(38px,7vw,76px);font-weight:800}.brandbig span{color:#f5650a;font-size:.7em}.tag{font-size:25px;font-style:italic;margin:18px}.badge{background:#f5650a;color:white;padding:12px 24px;border-radius:30px;font-weight:800}.definition,.example{background:#fff;border-left:7px solid #f5650a;padding:25px;border-radius:16px;font-size:clamp(20px,3vw,30px);margin-bottom:24px}.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 16px #0001;border-top:5px solid #f5650a;min-height:115px}.card b{font-size:20px}.card p{color:#666;line-height:1.4}.flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:45px 0}.flowbox{background:#fff;border-radius:16px;padding:25px;width:190px;min-height:135px;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 5px 16px #0001}.flowbox b{color:#f5650a;font-size:20px;margin-bottom:10px}.flowbox small{color:#666;font-size:15px}.flow i{font-size:38px;color:#f5650a}.practical{background:#f5650a;color:#fff;padding:15px;border-radius:12px;text-align:center;font-weight:800;margin-top:18px}.nav{position:fixed;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:center;gap:14px;z-index:5}.nav button{border:0;border-radius:10px;padding:13px 22px;background:#151515;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.nav .next{background:#f5650a}.nav button:disabled{opacity:.35}.count{color:#666;font-weight:700;min-width:90px;text-align:center}.quiz{max-width:900px;margin:auto}.qcard{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 16px #0001}.qcard h2{font-size:21px}.option{display:block;width:100%;text-align:left;background:white;border:2px solid #e5d9ce;border-radius:10px;padding:13px;margin:8px 0;font-size:16px;cursor:pointer}.option.correct{background:#e9f7ee;border-color:#198754}.option.wrong{background:#fff0f0;border-color:#c62828}.feedback{display:none;padding:12px;border-radius:9px;margin-top:10px;font-weight:700}.show{display:block}.ok{background:#e9f7ee;color:#146c43}.bad{background:#fff0f0;color:#b02a37}.result{display:none;background:#fff;border-radius:18px;text-align:center;padding:30px;margin:20px 0}.score{font-size:48px;color:#f5650a;font-weight:900}.restart{background:#f5650a;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:800}

<div class="top"><div>SUNNET FUSION <span>TECHNOLOGY PATHWAY</span></div><div class="tagtop">…Igniting Futures Early</div></div>
<div id="app"></div>
<div class="nav"><button id="prev" onclick="go(-1)">‹ Previous</button><div class="count" id="count">Slide 1 of 7</div><button id="next" class="next" onclick="go(1)">Next ›</button></div>
<script>
const lesson=[["INTRODUCTION TO COMPUTER SCIENCE", "Lesson 1: Computers & Modern Computer Types", "<div class=\"hero\"><div class=\"brandbig\">SUNNET FUSION<br><span>TECHNOLOGY PATHWAY</span></div><div class=\"tag\">\u2026Igniting Futures Early</div><div class=\"badge\">LESSON 1</div></div>"], ["What is Computer Science?", "Let\u2019s understand the technology behind the world around us.", "<div class=\"definition\">Computer Science is the study of <b>computers, technology, information, and problem-solving.</b></div><div class=\"grid two\"><div class=\"card\"><b>\ud83d\udca1 Solve Problems</b><p>Use technology to find solutions.</p></div><div class=\"card\"><b>\ud83d\udcbb Understand Computers</b><p>Learn how computers and systems work.</p></div><div class=\"card\"><b>\ud83e\udde9 Create Solutions</b><p>Build programs and useful digital tools.</p></div><div class=\"card\"><b>\ud83c\udf0d Improve Everyday Life</b><p>Use technology in creative and helpful ways.</p></div></div>"], ["What is a Computer?", "A computer receives information, works with it, and gives us useful results.", "<div class=\"flow\"><div class=\"flowbox\"><b>INPUT</b><small>Data enters.</small></div><i>\u2192</i><div class=\"flowbox\"><b>PROCESS</b><small>Computer works on data.</small></div><i>\u2192</i><div class=\"flowbox\"><b>OUTPUT</b><small>Result is shown.</small></div><i>\u2192</i><div class=\"flowbox\"><b>STORAGE</b><small>Information is saved.</small></div></div><div class=\"example\"><b>Example:</b> You type a question \u2192 the computer processes it \u2192 the answer appears on the screen.</div>"], ["Where Do We Use Computers?", "Computers are part of many activities and services around us.", "<div class=\"grid three\"><div class=\"card\"><b>\ud83c\udf93 Education</b><p>Learning and digital classrooms.</p></div><div class=\"card\"><b>\ud83c\udfe6 Banking</b><p>Accounts, payments and records.</p></div><div class=\"card\"><b>\ud83c\udfe5 Healthcare</b><p>Patient records and medical systems.</p></div><div class=\"card\"><b>\ud83d\udcbc Business</b><p>Communication, sales and data.</p></div><div class=\"card\"><b>\ud83d\ude97 Transportation</b><p>Navigation and booking.</p></div><div class=\"card\"><b>\ud83c\udfae Entertainment</b><p>Games, music, movies and creativity.</p></div></div>"], ["Types of Modern Computers", "Different computers are designed for different needs.", "<div class=\"grid three\"><div class=\"card\"><b>\ud83d\udda5\ufe0f Desktop</b><p>Designed to stay in one place.</p></div><div class=\"card\"><b>\ud83d\udcbb Laptop</b><p>Portable computer with built-in screen and keyboard.</p></div><div class=\"card\"><b>\ud83d\udcf1 Tablet</b><p>Portable touchscreen computer.</p></div><div class=\"card\"><b>\ud83d\udcf2 Smartphone</b><p>Small computer used for communication and apps.</p></div><div class=\"card\"><b>\u231a Smartwatch</b><p>Wearable computer with smart features.</p></div><div class=\"card\"><b>\ud83d\uddc4\ufe0f Server</b><p>Provides services or resources to other computers.</p></div></div>"], ["Let\u2019s Identify the Computer Parts", "Can you name these common parts and tell what each one does?", "<div class=\"grid three\"><div class=\"card\"><b>\ud83d\udda5\ufe0f Monitor</b><p>Displays text, pictures and videos.</p></div><div class=\"card\"><b>\u2328\ufe0f Keyboard</b><p>Enters letters, numbers and commands.</p></div><div class=\"card\"><b>\ud83d\uddb1\ufe0f Mouse</b><p>Controls the pointer and selects items.</p></div><div class=\"card\"><b>\ud83e\udde0 System Unit</b><p>Houses important internal components.</p></div><div class=\"card\"><b>\ud83d\udd0a Speakers</b><p>Produce sound.</p></div><div class=\"card\"><b>\ud83d\udcf7 Webcam</b><p>Captures images and video.</p></div></div><div class=\"practical\">PRACTICAL: Identify and label the parts on a real computer or picture.</div>"]];
const qs=[["Which statement best describes Computer Science?", ["The study of computers, technology, and problem-solving", "The study of drawing and painting pictures", "The study of only computer games", "The study of only typing documents"], 0], ["Which of these is a type of modern computer?", ["Notebook paper", "Laptop", "School bag", "Pencil"], 1], ["Which computer part is mainly used to enter text and numbers?", ["Monitor", "Keyboard", "Speaker", "Mouse pad"], 1], ["Which of these is a place where computers are commonly used?", ["Bank", "Empty playground", "Wooden chair", "Pencil case"], 0], ["Which computer part displays information such as text and pictures?", ["Mouse", "Keyboard", "Monitor", "Mouse pad"], 2]];
let current=0;
const app=document.getElementById('app');
lesson.forEach((s,i)=>{let d=document.createElement('section');d.className='slide'+(i===0?' active':'');d.innerHTML=i===0?s[2]:`<h1>${s[0]}</h1><div class='sub'>${s[1]}</div>${s[2]}`;app.appendChild(d)});
let quiz=document.createElement('section');quiz.className='slide';quiz.innerHTML=`<div class='quiz'><h1>Quiz Time! 🎯</h1><div class='sub'>Choose A, B, C or D. You will get immediate feedback.</div><div class='definition' style='font-size:18px'><b>5 questions • 1 point each</b><br>Answer all five questions to see your final score.</div><div id='qwrap'></div><div class='result' id='result'><b>QUIZ COMPLETE 🎉</b><div class='score' id='score'></div><p id='message'></p><button class='restart' onclick='resetQuiz()'>Try Again</button></div></div>`;app.appendChild(quiz);
function renderQuiz(){let w=document.getElementById('qwrap');w.innerHTML='';qs.forEach((x,i)=>{let c=document.createElement('div');c.className='qcard';c.dataset.done='0';c.innerHTML=`<h2>Question ${i+1} of 5: ${x[0]}</h2>`;x[1].forEach((o,j)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>answer(c,i,j);c.appendChild(b)});let f=document.createElement('div');f.className='feedback';c.appendChild(f);w.appendChild(c)})}
function answer(c,i,j){if(c.dataset.done==='1')return;c.dataset.done='1';let bs=c.querySelectorAll('.option');bs.forEach(b=>b.disabled=true);let f=c.querySelector('.feedback');if(j===qs[i][2]){bs[j].classList.add('correct');f.className='feedback show ok';f.textContent='✓ Correct!'}else{bs[j].classList.add('wrong');bs[qs[i][2]].classList.add('correct');f.className='feedback show bad';f.textContent='✗ You got this one wrong. Correct answer: '+String.fromCharCode(65+qs[i][2])+'. '+qs[i][1][qs[i][2]]}finish()}
function finish(){let cs=[...document.querySelectorAll('.qcard')];if(!cs.every(c=>c.dataset.done==='1'))return;let score=0;cs.forEach((c,i)=>{if(c.querySelector('.option.correct').textContent.startsWith(String.fromCharCode(65+qs[i][2])+'.'))score++});document.getElementById('result').style.display='block';document.getElementById('score').textContent=score+' / 5';document.getElementById('message').textContent=score===5?'Excellent! You got every question correct! 🌟':score>=3?'Well done! You got '+(5-score)+' wrong. Review and try again!':'You got '+(5-score)+' wrong. Review the lesson and try again!';document.getElementById('result').scrollIntoView({behavior:'smooth'})}
function resetQuiz(){renderQuiz();document.getElementById('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
function go(n){current=Math.max(0,Math.min(6,current+n));document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===current));document.getElementById('count').textContent='Slide '+(current+1)+' of 7';document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===6?'Quiz ↓':'Next ›';window.scrollTo({top:0,behavior:'smooth'})}
renderQuiz();go(0);
</script></body></html>
